<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8ccce7">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./pond-icon.svg" type="image/svg+xml">
<meta name="description" content="A quiet little pond. Guide fallen leaves across the water and leave delicate trails behind.">
<title>Leafy Pond</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ccce7}body{font-family:Georgia,serif;touch-action:none}canvas{display:block;width:100%;height:100%}
.title{position:fixed;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;color:#f7f0df;text-shadow:0 1px 8px #25474a55;letter-spacing:.12em;font-size:clamp(19px,3vw,27px);font-weight:normal}
.hint{position:fixed;bottom:max(25px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f4efdf;opacity:.78;font:12px/1.5 system-ui,sans-serif;letter-spacing:.08em;pointer-events:none;text-shadow:0 1px 6px #24474b66;transition:opacity 2s}.hint.fade{opacity:0}
.sound{position:fixed;right:18px;top:max(18px,env(safe-area-inset-top));border:1px solid #f5f0df66;border-radius:50%;width:40px;height:40px;background:#345f6060;color:#fff8e8;font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<canvas id="pond" aria-label="A peaceful pond with floating autumn leaves. Drag a leaf across the water to draw a trail."></canvas>
<div class="title">leafy pond</div><button class="sound" id="sound" aria-label="Turn pond sounds on">♪</button><div class="hint" id="hint">Gently move a leaf across the water</div>
<script>
(()=>{
const canvas=document.getElementById('pond'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint'),soundButton=document.getElementById('sound');
let w=0,h=0,dpr=1,last=0,elapsed=0,spawnClock=0,audio=null,soundOn=false,active=null,offset={x:0,y:0};
const leaves=[],wakes=[],ripples=[];
const palette=[['#df792c','#ffc26c','#9c4920'],['#e5a52c','#ffe17b','#aa6924'],['#c95724','#f5a04a','#913c24'],['#efad37','#ffe080','#b36c2b'],['#ce6c2c','#f9b45d','#9c4d27']];
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!leaves.length){for(let i=0;i<4;i++)addLeaf(rand(w*.12,w*.88),rand(h*.18,h*.84),false)}}
function addLeaf(x,y,fall=true){
 const colors=palette[Math.floor(Math.random()*palette.length)],size=rand(31,45);
 leaves.push({x,y,px:x,py:y,vx:rand(-3,3),vy:fall?rand(19,32):rand(-1,1),angle:rand(-Math.PI,Math.PI),spin:rand(-.32,.32),size,colors,fall,phase:rand(0,8),drag:false,trailClock:0,fallStart:y,fallDistance:fall?rand(58,112):0,alpha:fall?0:1});
}
function water(){
 ctx.fillStyle='#a3ddf1';ctx.fillRect(0,0,w,h);
 const wash=ctx.createLinearGradient(0,0,w*.35,h);
 wash.addColorStop(0,'#c5ecf3');wash.addColorStop(.5,'#85c9ed');wash.addColorStop(1,'#529bd2');
 ctx.fillStyle=wash;ctx.fillRect(0,0,w,h);
 // Stable, overlapping watercolor brush washes with translucent edges.
 ctx.save();
 for(let i=0;i<105;i++){
  const x=((i*173.13)% (w+260))-130,y=((i*91.71)%(h+180))-90;
  const rx=55+(i*37)%115,ry=10+(i*19)%30;
  ctx.globalAlpha=.035+(i%5)*.009;
  ctx.fillStyle=i%3===0?'#f9fffc':i%3===1?'#367db9':'#b9eef3';
  ctx.beginPath();ctx.ellipse(x+Math.sin(elapsed*.12+i)*3,y,rx,ry,Math.sin(i*3)*.08,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
 // Gently shifting white, refracted water-light lines.
 ctx.save();ctx.lineCap='round';
 for(let i=0;i<72;i++){
  const x=(i*107.3)%(w+90)-45,y=(i*79.7)%(h+50)-25;
  const shift=Math.sin(elapsed*.32+i*.73)*8;
  ctx.globalAlpha=.13+(i%4)*.035;ctx.strokeStyle='#f4ffff';ctx.lineWidth=1.4+(i%3)*.7;
  ctx.beginPath();ctx.moveTo(x-22,y+shift);
  ctx.bezierCurveTo(x-8,y-7+shift,x+12,y+8+shift,x+34,y-1+shift);ctx.stroke();
 }
 ctx.restore();
 // Static paper grain, rather than flickering per-frame noise.
 ctx.save();for(let i=0;i<650;i++){ctx.globalAlpha=.025+(i%4)*.01;ctx.fillStyle=i%2?'#ffffff':'#337bb2';ctx.fillRect((i*71.71)%w,(i*137.31)%h,1.5,1.5)}ctx.restore();
}
function drawLeaf(l){
 ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.angle);ctx.globalAlpha=l.alpha;const s=l.size;
 ctx.shadowColor='#2b659055';ctx.shadowBlur=7;ctx.shadowOffsetY=7;
 // Five-pointed, deeply lobed maple leaf with watercolor fill.
 ctx.beginPath();ctx.moveTo(0,-s*1.06);
 const pts=[[.16,-.66],[.4,-.83],[.4,-.54],[.84,-.63],[.68,-.31],[1.02,-.19],[.73,.06],[.81,.36],[.48,.32],[.38,.69],[.13,.53],[0,.96],[-.13,.53],[-.38,.69],[-.48,.32],[-.81,.36],[-.73,.06],[-1.02,-.19],[-.68,-.31],[-.84,-.63],[-.4,-.54],[-.4,-.83],[-.16,-.66]];
 for(const p of pts)ctx.lineTo(p[0]*s,p[1]*s);
 ctx.closePath();
 const g=ctx.createLinearGradient(-s,-s,s,s);g.addColorStop(0,l.colors[1]);g.addColorStop(.46,l.colors[0]);g.addColorStop(1,l.colors[2]);ctx.fillStyle=g;ctx.fill();
 ctx.shadowColor='transparent';ctx.strokeStyle=l.colors[2];ctx.lineWidth=1.35;ctx.stroke();
 // Slightly imperfect inked edge, fine central vein and side veins.
 ctx.beginPath();ctx.moveTo(0,s*.84);ctx.quadraticCurveTo(-s*.07,0,0,-s*.83);ctx.strokeStyle='#f5dfb0cc';ctx.lineWidth=1.35;ctx.stroke();
 for(let i=0;i<6;i++){const t=(i+1)/7,yy=s*.7-t*s*1.43,spread=Math.sin(t*Math.PI)*s*.53;
  ctx.beginPath();ctx.moveTo(0,yy+s*.08);ctx.quadraticCurveTo(spread*.35,yy,spread,yy-s*.12);ctx.moveTo(0,yy+s*.08);ctx.quadraticCurveTo(-spread*.35,yy,-spread,yy-s*.12);
  ctx.strokeStyle='#f4d8a0a8';ctx.lineWidth=.85;ctx.stroke();
 }
 // Tiny hand-painted pigment flecks.
 ctx.globalAlpha*=.19;for(let i=0;i<22;i++){const xx=Math.sin(i*17.13+l.phase*.01)*s*.39,yy=Math.cos(i*8.91)*s*.48;ctx.fillStyle=i%2?l.colors[2]:l.colors[1];ctx.beginPath();ctx.ellipse(xx,yy,1.3+(i%3),2+(i%4),i,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
function drawWake(t){
 ctx.save();const a=Math.max(0,t.life);ctx.globalAlpha=a*.48;ctx.lineCap='round';ctx.lineJoin='round';
 const dx=t.x2-t.x1,dy=t.y2-t.y1,len=Math.hypot(dx,dy)||1,px=-dy/len,py=dx/len;
 for(const side of [-1,1]){
  ctx.beginPath();ctx.moveTo(t.x1+px*side*1.2,t.y1+py*side*1.2);
  ctx.quadraticCurveTo((t.x1+t.x2)/2+px*side*(5+len*.17),(t.y1+t.y2)/2+py*side*(5+len*.17),t.x2+px*side*(2+len*.08),t.y2+py*side*(2+len*.08));
  ctx.strokeStyle='#e9edda';ctx.lineWidth=1.25;ctx.stroke();
 }
 ctx.globalAlpha=a*.18;ctx.beginPath();ctx.ellipse((t.x1+t.x2)/2,(t.y1+t.y2)/2,Math.max(3,len*.24),Math.max(1,len*.045),Math.atan2(dy,dx),0,Math.PI*2);ctx.strokeStyle='#f7f1dc';ctx.lineWidth=2;ctx.stroke();ctx.restore();
}
function drawRipple(r){
 ctx.save();const a=Math.max(0,r.life);ctx.globalAlpha=a*.64;ctx.strokeStyle='#f4ffff';ctx.lineWidth=2;
 for(let k=0;k<2;k++){ctx.beginPath();ctx.ellipse(r.x,r.y,r.radius*(1+k*.48),r.radius*(.57+k*.24),-.12,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
}
function frame(ts){
 const dt=Math.min((ts-last)/1000||0,.04);last=ts;elapsed+=dt;spawnClock+=dt;water();
 for(let i=wakes.length-1;i>=0;i--){const t=wakes[i];t.life-=dt*1.05;if(t.life<=0)wakes.splice(i,1);else drawWake(t)}
 for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.radius+=dt*39;r.life-=dt*.72;if(r.life<=0)ripples.splice(i,1);else drawRipple(r)}
 if(spawnClock>3.8&&leaves.filter(l=>!l.fall).length<7){spawnClock=0;addLeaf(rand(w*.09,w*.91),rand(h*.12,h*.75),true)}
 for(let i=leaves.length-1;i>=0;i--){const l=leaves[i];l.px=l.x;l.py=l.y;
  if(!l.drag){l.phase+=dt;l.x+=l.vx*dt+Math.sin(elapsed*.48+l.phase)*3.5*dt;l.y+=l.vy*dt;l.angle+=l.spin*dt;
   if(l.fall){l.alpha=Math.min(1,l.alpha+dt*1.5);if(l.y-l.fallStart>=l.fallDistance){l.fall=false;l.vy=rand(-.5,.5);l.alpha=1;ripples.push({x:l.x,y:l.y,radius:2,life:1})}}
  }
  if(l.y>h+70||l.x<-90||l.x>w+90){leaves.splice(i,1);continue}drawLeaf(l)
 }
 requestAnimationFrame(frame);
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{const p=pos(e);let best=null,dist=Infinity;for(const l of leaves){if(l.fall)continue;const d=Math.hypot(l.x-p.x,l.y-p.y);if(d<l.size*1.5&&d<dist){best=l;dist=d}}if(best){active=best;best.drag=true;offset.x=best.x-p.x;offset.y=best.y-p.y;canvas.setPointerCapture(e.pointerId);hint.classList.add('fade')}});
canvas.addEventListener('pointermove',e=>{if(!active)return;const p=pos(e);active.x=p.x+offset.x;active.y=p.y+offset.y;active.angle+=(active.x-active.px)*.006;active.trailClock++;if(active.trailClock%2===0){wakes.push({x1:active.px,y1:active.py,x2:active.x,y2:active.y,life:1});if(wakes.length>100)wakes.shift()}});
function release(){if(active){active.drag=false;active.vx=rand(-2,2);active.vy=rand(-1,1);ripples.push({x:active.x,y:active.y,radius:2,life:.8});active=null}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function toggleSound(){if(!soundOn){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();const master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.12;const noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=420;const gain=audio.createGain();gain.gain.value=.16;noise.connect(filter);filter.connect(gain);gain.connect(master);noise.start();soundOn=true;soundButton.textContent='♫'}else{if(audio)audio.close();audio=null;soundOn=false;soundButton.textContent='♪'}}
soundButton.addEventListener('click',toggleSound);window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
