<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8ccce7">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./pond-icon.svg" type="image/svg+xml">
<meta name="description" content="A quiet little pond. Guide fallen leaves across the water and leave delicate trails behind.">
<title>Leafy Pond</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ccce7}body{font-family:Georgia,serif;touch-action:none}canvas{display:block;width:100%;height:100%}
.title{position:fixed;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;color:#f7f0df;text-shadow:0 1px 8px #25474a55;letter-spacing:.12em;font-size:clamp(19px,3vw,27px);font-weight:normal}
.hint{position:fixed;bottom:max(25px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f4efdf;opacity:.78;font:12px/1.5 system-ui,sans-serif;letter-spacing:.08em;pointer-events:none;text-shadow:0 1px 6px #24474b66;transition:opacity 2s}.hint.fade{opacity:0}
.sound{position:fixed;right:18px;top:max(18px,env(safe-area-inset-top));border:1px solid #f5f0df66;border-radius:50%;width:40px;height:40px;background:#345f6060;color:#fff8e8;font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<canvas id="pond" aria-label="A peaceful pond with floating autumn leaves. Drag a leaf across the water to draw a trail."></canvas>
<div class="title">leafy pond</div><button class="sound" id="sound" aria-label="Pond sounds unavailable" hidden>♪</button><div class="hint" id="hint">Gently move a leaf across the water</div>
<script>
(()=>{
const canvas=document.getElementById('pond'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint'),soundButton=document.getElementById('sound');
let w,h,dpr,last=0,t=0,clock=0,active=null,audio=null,texture=null;
const leaves=[],ripples=[],wakes=[];
const R=(a,b)=>a+Math.random()*(b-a),colors=[['#f5ae35','#d66b24','#a7491d'],['#f6c64e','#e59a27','#a9621b'],['#f2a048','#c85a27','#943d22'],['#e7ba45','#d7872d','#ad5d1f']];
function makeTexture(){
 const c=document.createElement('canvas');c.width=800;c.height=800;const p=c.getContext('2d');
 let g=p.createLinearGradient(0,0,260,800);g.addColorStop(0,'#d8f2f3');g.addColorStop(.4,'#9fd4ed');g.addColorStop(1,'#639fd2');p.fillStyle=g;p.fillRect(0,0,800,800);
 // Broad translucent brush washes, fixed in place so they never flicker.
 for(let i=0;i<290;i++){
  const x=R(-100,900),y=R(-40,840),rx=R(25,180),ry=R(6,30);
  p.save();p.translate(x,y);p.rotate(R(-.18,.18));p.globalAlpha=R(.018,.11);
  p.fillStyle=['#ffffff','#d9f7f4','#397eae','#7ab5df','#b7e9f4'][i%5];
  p.beginPath();p.ellipse(0,0,rx,ry,0,0,Math.PI*2);p.fill();p.restore();
 }
 // Meandering pale caustic patterns, not parallel digital stripes.
 p.lineCap='round';
 for(let i=0;i<110;i++){
  let x=R(-50,850),y=R(-30,830);
  p.strokeStyle=i%3?'#efffff':'#458fc3';p.globalAlpha=R(.055,.22);p.lineWidth=R(2,7);
  p.beginPath();p.moveTo(x,y);p.bezierCurveTo(x+R(8,24),y-R(5,18),x+R(30,60),y+R(4,17),x+R(55,100),y+R(-9,9));p.stroke();
 }
 const id=p.getImageData(0,0,800,800),d=id.data;
 for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*19;d[i]=Math.max(0,Math.min(255,d[i]+n));d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));}
 p.putImageData(id,0,0);texture=c;
}
function resize(){const oldW=w||1,oldH=h||1;w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);for(const l of leaves){l.x=l.x/oldW*w;l.y=l.y/oldH*h}if(!leaves.length)for(let i=0;i<3;i++)addLeaf(R(.14*w,.86*w),R(.17*h,.83*h),true);}
function addLeaf(x,y,landed=false){
 const l={x,y,angle:R(-3,3),size:R(31,48),c:colors[Math.floor(R(0,colors.length))],phase:R(0,10),spin:R(-.11,.11),vx:R(-2,2),vy:R(-1,1),z:landed?0:1,drag:false,age:0};
 leaves.push(l);if(landed)ripples.push({x,y,age:0,force:1});
}
function leafShape(s){
 // Rounded, asymmetric lobes: curved watercolor maple leaf rather than spikes.
 const p=new Path2D();p.moveTo(0,-s*.94);
 p.bezierCurveTo(s*.09,-s*.79,s*.13,-s*.71,s*.19,-s*.66);
 p.bezierCurveTo(s*.38,-s*.86,s*.52,-s*.78,s*.49,-s*.55);
 p.bezierCurveTo(s*.47,-s*.47,s*.43,-s*.42,s*.43,-s*.38);
 p.bezierCurveTo(s*.78,-s*.56,s*.9,-s*.43,s*.75,-s*.23);
 p.bezierCurveTo(s*.7,-s*.15,s*.62,-s*.12,s*.6,-s*.08);
 p.bezierCurveTo(s*.91,-s*.03,s*.9,s*.15,s*.69,s*.24);
 p.bezierCurveTo(s*.56,s*.28,s*.46,s*.25,s*.39,s*.3);
 p.bezierCurveTo(s*.47,s*.57,s*.28,s*.67,s*.13,s*.53);
 p.quadraticCurveTo(s*.04,s*.49,s*.06,s*.78);
 p.lineTo(0,s*1.03);p.lineTo(-s*.06,s*.78);
 p.quadraticCurveTo(-s*.04,s*.49,-s*.13,s*.53);
 p.bezierCurveTo(-s*.28,s*.67,-s*.47,s*.57,-s*.39,s*.3);
 p.bezierCurveTo(-s*.46,s*.25,-s*.56,s*.28,-s*.69,s*.24);
 p.bezierCurveTo(-s*.9,s*.15,-s*.91,-s*.03,-s*.6,-s*.08);
 p.bezierCurveTo(-s*.62,-s*.12,-s*.7,-s*.15,-s*.75,-s*.23);
 p.bezierCurveTo(-s*.9,-s*.43,-s*.78,-s*.56,-s*.43,-s*.38);
 p.bezierCurveTo(-s*.43,-s*.42,-s*.47,-s*.47,-s*.49,-s*.55);
 p.bezierCurveTo(-s*.52,-s*.78,-s*.38,-s*.86,-s*.19,-s*.66);
 p.bezierCurveTo(-s*.13,-s*.71,-s*.09,-s*.79,0,-s*.94);p.closePath();return p;
}
function drawLeaf(l){
 const s=l.size,scale=1+l.z*.55;
 ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.angle);ctx.scale(scale,scale);
 ctx.globalAlpha=1-l.z*.28;
 ctx.shadowColor='#245d8270';ctx.shadowBlur=9+l.z*9;ctx.shadowOffsetY=4+l.z*9;
 const path=leafShape(s),g=ctx.createLinearGradient(-s,-s,s,s);
 g.addColorStop(0,l.c[0]);g.addColorStop(.48,l.c[1]);g.addColorStop(1,l.c[2]);
 ctx.fillStyle=g;ctx.fill(path);ctx.shadowColor='transparent';
 ctx.save();ctx.clip(path);
 // Translucent watercolor pools, subtle pigment and irregular edges.
 for(let i=0;i<38;i++){
  const xx=Math.sin(i*17.1+l.phase*.001)*s*.7,yy=Math.cos(i*8.8)*s*.65;
  ctx.globalAlpha=.07+(i%4)*.025;ctx.fillStyle=i%3===0?'#fff2a0':i%3===1?l.c[2]:'#c34b1e';
  ctx.beginPath();ctx.ellipse(xx,yy,3+i%6,5+i%8,i*.3,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();ctx.globalAlpha=.8;ctx.strokeStyle=l.c[2];ctx.lineWidth=.8;ctx.stroke(path);
 ctx.strokeStyle='#8f4d2788';ctx.lineWidth=.95;ctx.beginPath();ctx.moveTo(0,s*.85);ctx.quadraticCurveTo(-s*.035,0,0,-s*.82);ctx.stroke();
 for(const side of [-1,1])for(let i=0;i<4;i++){
  const yy=s*(.39-i*.28),ex=side*s*(.39+i*.09),ey=yy-s*.25;
  ctx.beginPath();ctx.moveTo(0,yy);ctx.quadraticCurveTo(ex*.55,yy-s*.1,ex,ey);ctx.stroke();
 }
 ctx.restore();
}
function drawWater(){
 ctx.drawImage(texture,0,0,w,h);
 ctx.save();ctx.globalAlpha=.09;ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.lineCap='round';
 for(let i=0;i<32;i++){let x=(i*131.7)%w,y=(i*79.3)%h+Math.sin(t*.24+i)*4;ctx.beginPath();ctx.moveTo(x-20,y);ctx.bezierCurveTo(x,y-8,x+20,y+8,x+44,y-1);ctx.stroke()}ctx.restore();
}
function ripple(r){
 const age=r.age,rad=5+age*65,fade=Math.max(0,1-age/2.3);
 ctx.save();ctx.translate(r.x,r.y);ctx.scale(1,.59);
 for(let k=0;k<4;k++){const rr=rad-k*11;if(rr<=0)continue;
 ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,'+(fade*(.48-k*.075))+')';ctx.lineWidth=3.2-k*.35;ctx.stroke();
 ctx.beginPath();ctx.arc(0,2.5,rr+2,0,Math.PI*2);ctx.strokeStyle='rgba(39,112,161,'+(fade*.13)+')';ctx.lineWidth=2;ctx.stroke();
 }ctx.restore();
}
function frame(ms){
 const dt=Math.min(.045,(ms-last)/1000||0);last=ms;t+=dt;clock+=dt;drawWater();
 if(clock>2.8&&leaves.length<12){clock=0;addLeaf(R(w*.08,w*.92),R(h*.08,h*.9))}
 for(let i=ripples.length-1;i>=0;i--){ripples[i].age+=dt;if(ripples[i].age>2.3)ripples.splice(i,1);else ripple(ripples[i])}
 for(let i=wakes.length-1;i>=0;i--){const a=wakes[i];a.age+=dt;if(a.age>1.2){wakes.splice(i,1);continue}ctx.save();ctx.globalAlpha=(1-a.age/1.2)*.48;ctx.strokeStyle='#f6ffff';ctx.lineWidth=1.8;ctx.beginPath();ctx.ellipse(a.x,a.y,4+a.age*17,2+a.age*8,a.angle,0,Math.PI*2);ctx.stroke();ctx.restore()}
 for(const l of leaves){l.age+=dt;if(!l.drag){l.phase+=dt;l.angle+=l.spin*dt;
 if(l.z>0){l.z=Math.max(0,l.z-dt*.48);l.x+=Math.sin(t*1.7+l.phase)*dt*7;if(l.z===0){ripples.push({x:l.x,y:l.y,age:0});l.vx=R(-1.8,1.8);l.vy=R(-.8,.8)}}else{l.x+=l.vx*dt+Math.sin(t*.6+l.phase)*dt*.5;l.y+=l.vy*dt;}}
 drawLeaf(l)}
 for(let i=leaves.length-1;i>=0;i--){const l=leaves[i];if(l.x<-100||l.x>w+100||l.y<-100||l.y>h+100)leaves.splice(i,1)}
 requestAnimationFrame(frame);
}
function pos(e){const b=canvas.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
canvas.addEventListener('pointerdown',e=>{const p=pos(e);for(let i=leaves.length-1;i>=0;i--){const l=leaves[i];if(l.z>0)continue;if(Math.hypot(l.x-p.x,l.y-p.y)<l.size*.85){active=l;l.drag=true;canvas.setPointerCapture(e.pointerId);hint.classList.add('fade');break}}});
canvas.addEventListener('pointermove',e=>{if(!active)return;const p=pos(e),dx=p.x-active.x,dy=p.y-active.y;active.x=p.x;active.y=p.y;active.angle+=dx*.004;wakes.push({x:p.x-dx*.5,y:p.y-dy*.5,angle:Math.atan2(dy,dx),age:0})});
function release(){if(active){active.drag=false;active.vx=R(-2,2);active.vy=R(-1,1);ripples.push({x:active.x,y:active.y,age:0});active=null}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
soundButton.style.display='none';
makeTexture();window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
